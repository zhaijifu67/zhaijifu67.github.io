			function openTokenEditor(id) {
				var el = document.getElementById('token_' + id);
				if (!el) return;
				var imgPreview = document.getElementById('newTokenImg');
				var im = el.children[0].children[0];

				// 关键：先把预览设成该角色的真实图像（不要用 imgPreview.src 去回填）
				imgPreview.src = im.src;
				imgPreview.alt = im.alt || '';
				imgPreview.title = im.alt || '';
				imgPreview.style.width = im.style.width;
				imgPreview.style.height = im.style.height;

				document.getElementById('token_name').value = im.alt || '角色名';

				// 反推 tokenImgSource
				var srcVal = im.src || '';
				if (srcVal.indexOf('data:image/svg+xml,') === 0) {
					var decoded = '';
					try {
						decoded = decodeURIComponent(srcVal.replace('data:image/svg+xml,', ''));
					} catch (e) {}
					var m = decoded.match(/<text[^>]*>([\s\S]*?)<\/text>/);
					var text = m ? m[1] : '';
					var nameFirst = '';
					if (window.Intl && Intl.Segmenter) {
						var seg = new Intl.Segmenter('zh', {
							granularity: 'grapheme'
						});
						var it = seg.segment(im.alt || '')[Symbol.iterator]();
						var r = it.next();
						if (!r.done) nameFirst = r.value.segment;
					}
					if (text && text !== nameFirst) {
						tokenImgSource = 'preset';
						tokenPresetIcon = text;
					} else {
						tokenImgSource = 'name';
						tokenPresetIcon = '';
					}
				} else {
					tokenImgSource = 'custom';
					tokenPresetIcon = '';
				}

				document.getElementById('token_img_src').value = srcVal.length <= 500 ? srcVal : '图片数据';
				document.getElementById('token_size_x').value = parseFloat(im.style.width) || 1;
				document.getElementById('token_size_y').value = parseFloat(im.style.height) || 1;

				var hp = el.querySelector('.token-hp');
				document.getElementById('token_hp_show').checked = hp && hp.style.display !== 'none';
				document.getElementById('token_hp_max').value = hp ? (hp.getAttribute('hp_max') || 20) : 20;

				document.getElementById('bt_changeToken').style.display = 'inline-block';
				updateColorBoxState();
				openModal('newToken');
			}

			/* ================================================================ */
			/* 存档 / 导入                                                     */
			/* ================================================================ */
			function exportData() {
				var data = {
					version: 4,
					isHex: document.getElementById('box_hexagon').checked,
					halfGrid: document.getElementById('halfGridToggle').checked,
					boxSize: parseInt(document.getElementById('boxSize').value) || 40,
					gridOffsetX: gridOffsetX,
					gridOffsetY: gridOffsetY,
					tokens: [],
					maps: [],
					terrain: Object.assign({}, terrainGrid)
				};

				/* ---- 角色 ---- */
				var tokenUser = document.getElementById('token_user');
				var tokenIdx = 1;
				for (var i = 0; i < tokenUser.children.length; i++) {
					var el = tokenUser.children[i];
					if (!el.id || el.id.indexOf('token_') !== 0) continue;
					var im = el.children[0].children[0];
					var hp = el.querySelector('.token-hp');
					var hpMax = hp ? (parseInt(hp.getAttribute('hp_max')) || 20) : 20;
					var fill = hp ? hp.querySelector('.token-hp-fill') : null;
					var pct = fill ? (parseFloat(fill.style.width) || 100) : 100;
					data.tokens.push({
						id: tokenIdx,
						left: parseFloat(el.style.left) || 0,
						top: parseFloat(el.style.top) || 0,
						imgSrc: im.src,
						imgAlt: im.alt || '',
						w: parseFloat(im.style.width) || 1,
						h: parseFloat(im.style.height) || 1,
						hpMax: hpMax,
						hpCur: Math.round(hpMax * pct / 100),
						hpShow: hp ? hp.style.display !== 'none' : true,
						locked: el.dataset.locked === '1'
					});
					tokenIdx++;
				}

				/* ---- 地图 ---- */
				var tokenBg = document.getElementById('token_bg');
				var mapIdx = 1;
				for (var j = 0; j < tokenBg.children.length; j++) {
					var mel = tokenBg.children[j];
					if (!mel.id || mel.id.indexOf('map_') !== 0) continue;
					var mim = mel.children[0].children[0];
					data.maps.push({
						id: mapIdx,
						left: parseFloat(mel.style.left) || 0,
						top: parseFloat(mel.style.top) || 0,
						bgImg: mim.style.backgroundImage || '',
						bgSize: mim.dataset.origBgSize || mim.style.backgroundSize || '3em 3em',
						bgRepeat: mim.style.backgroundRepeat || 'repeat',
						bgPos: mim.style.backgroundPosition || '',
						w: parseFloat(mim.dataset.origW) || 3,
						h: parseFloat(mim.dataset.origH) || 3,
						visible: mel.style.display !== 'none',
						rotation: parseFloat(mel.dataset.rotation) || 0,
						locked: mel.dataset.locked === '1'
					});
					mapIdx++;
				}

				var blob = new Blob([JSON.stringify(data, null, 2)], {
					type: 'application/json'
				});
				var url = URL.createObjectURL(blob);
				var a = document.createElement('a');
				a.href = url;
				a.download = 'paotuan-' + new Date().toISOString().slice(0, 10) + '.json';
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				setTimeout(function() {
					URL.revokeObjectURL(url);
				}, 1000);
			}

			function importData() {
				var input = document.createElement('input');
				input.type = 'file';
				input.accept = 'application/json';
				input.onchange = function() {
					if (!input.files[0]) return;
					var fr = new FileReader();
					fr.readAsText(input.files[0]);
					fr.onload = function() {
						try {
							var data = JSON.parse(fr.result);
							applyImportedData(data);
						} catch (e) {
							alert('导入失败：' + e.message);
						}
					};
				};
				input.click();
			}

			function applyImportedData(data) {
				if (!data) return;
				if (!confirm('导入将清空当前地图与角色，确定继续？')) return;

				/* ---- 清空所有 ---- */
				document.getElementById('token_user').innerHTML = '';
				document.getElementById('token_bg').innerHTML = '';
				document.getElementById('terrain_svg').innerHTML = '';
				document.getElementById('set_userList').innerHTML = '';
				document.getElementById('set_mapList').innerHTML = '';
				save_userList = [];
				save_mapList = [];
				terrainGrid = {};
				terrainElements = {};
				onMouse = null;
				mapDrag = null;
				if (typeof hideSelection === 'function') hideSelection();

				/* ---- 格子 ---- */
				var isHex = !!data.isHex;
				document.getElementById('box_square').checked = !isHex;
				document.getElementById('box_hexagon').checked = isHex;
				currentGridIsHex = isHex;
				var hg = !!data.halfGrid;
				document.getElementById('halfGridToggle').checked = hg;
				halfGridMode = hg;
				document.getElementById('map_line').style.display = isHex ? 'none' : 'block';
				document.getElementById('map_line_hexagon').style.display = isHex ? 'block' : 'none';

				var bs = parseInt(data.boxSize) || 40;
				document.getElementById('boxSize').value = bs;
				document.getElementById('map_main').style.fontSize = bs + 'px';

				/* ---- 网格偏移 ---- */
				gridOffsetX = 0;
				gridOffsetY = 0;
				updateGridOffset(parseFloat(data.gridOffsetX) || 0, parseFloat(data.gridOffsetY) || 0);
				document.getElementById('terrain_layer').style.left = (parseFloat(data.gridOffsetX) || 0) + 'em';
				document.getElementById('terrain_layer').style.top = (parseFloat(data.gridOffsetY) || 0) + 'em';

				/* ---- 角色 ---- */
				(data.tokens || []).forEach(function(t) {
					var opts = {
						id: t.id,
						left: t.left || 0,
						top: t.top || 0,
						imgSrc: t.imgSrc || 'data:image/svg+xml,',
						imgAlt: t.imgAlt || 'token',
						w: t.w || 1,
						h: t.h || 1,
						hpMax: t.hpMax || 20,
						hpCur: t.hpCur != null ? t.hpCur : (t.hpMax || 20),
						hpShow: t.hpShow !== false,
						locked: !!t.locked
					};
					document.getElementById('token_user').appendChild(buildTokenDom(opts));
					save_userList.push({
						id: opts.id
					});
				});

				/* ---- 地图（只一次！）---- */
				(data.maps || []).forEach(function(m) {
					var opts = {
						id: m.id,
						left: m.left || 0,
						top: m.top || 0,
						bgImg: m.bgImg || 'none',
						bgSize: m.bgSize || '3em 3em',
						bgRepeat: m.bgRepeat || 'repeat',
						bgPos: m.bgPos || '',
						w: m.w || 3,
						h: m.h || 3,
						visible: m.visible !== false,
						rotation: m.rotation || 0,
						locked: !!m.locked
					};
					document.getElementById('token_bg').appendChild(buildMapDom(opts));
					save_mapList.push({
						id: opts.id
					});
				});

				/* ---- 重建图层列表 ---- */
				rebuildUserList();
				rebuildUserLayers();
				rebuildMapList();
				rebuildMapLayers();

				/* ---- 地形 ---- */
				terrainGrid = data.terrain || {};
				redrawTerrain();
			}

			/* ================================================================ */
			/* 地形绘制                                                        */
			/* ================================================================ */
			function toggleDrawMode(checked) {
				// 开启绘制 → 先关闭地图拖拽
				if (checked && mapDragMode) {
					mapDragMode = false;
					document.getElementById('mapDragMode').checked = false;
					document.querySelectorAll('#token_bg > .map-elem').forEach(function(el) {
						el.classList.remove('map-draggable');
					});
					if (mapDrag) finishMapDrag(null);
					hideSelection();
				}

				drawMode = checked;
				var layer = document.getElementById('terrain_layer');
				var tokenUser = document.getElementById('token_user');
				var tokenBg = document.getElementById('token_bg');
				if (checked) {
					layer.classList.add('painting');
					tokenUser.style.pointerEvents = 'none';
					tokenBg.style.pointerEvents = 'none';
				} else {
					layer.classList.remove('painting');
					tokenUser.style.pointerEvents = '';
					tokenBg.style.pointerEvents = '';
				}
			}

			function getCellFromEvent(e) {
				var mapMain = document.getElementById('map_main');
				var rect = mapMain.getBoundingClientRect();
				var fs = parseFloat(getComputedStyle(mapMain).fontSize);
				var layer = document.getElementById('terrain_layer');
				var layerLeft = parseFloat(layer.style.left) || 0;
				var layerTop = parseFloat(layer.style.top) || 0;

				var emX = (e.clientX - rect.left) / fs - layerLeft;
				var emY = (e.clientY - rect.top) / fs - layerTop;

				if (!document.getElementById('box_hexagon').checked) {
					return {
						x: Math.floor(emX),
						y: Math.floor(emY)
					};
				} else {
					var row = Math.round((emY - HEX_CENTER_Y) / HEX_ROW_H);
					var parity = ((row % 2) + 2) % 2;
					var xOffset = 0.5 + parity * 0.5;
					var col = Math.round(emX - xOffset);
					return {
						x: col,
						y: row
					};
				}
			}

			function createTerrainElement(cellX, cellY, terrain) {
				var fs = parseFloat(getComputedStyle(document.getElementById('map_main')).fontSize);
				var isHex = document.getElementById('box_hexagon').checked;
				var color = terrainColors[terrain] || '#888888';

				if (!isHex) {
					var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
					rect.setAttribute('x', cellX * fs + TERRAIN_OFFSET);
					rect.setAttribute('y', cellY * fs + TERRAIN_OFFSET);
					rect.setAttribute('width', fs);
					rect.setAttribute('height', fs);
					rect.setAttribute('fill', color);
					rect.setAttribute('opacity', '0.68');
					return rect;
				} else {
					var parity = ((cellY % 2) + 2) % 2;
					var xOffset = parity * 0.5;
					var cx = (cellX + 0.5 + xOffset) * fs + TERRAIN_OFFSET;
					var cy = (cellY * HEX_ROW_H + HEX_CENTER_Y) * fs + TERRAIN_OFFSET;
					var R = fs * 0.5774;
					var halfW = fs / 2;
					var halfR = R / 2;
					var pts = [
						[cx, cy - R],
						[cx + halfW, cy - halfR],
						[cx + halfW, cy + halfR],
						[cx, cy + R],
						[cx - halfW, cy + halfR],
						[cx - halfW, cy - halfR]
					].map(function(p) {
						return p.join(',');
					}).join(' ');
					var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
					poly.setAttribute('points', pts);
					poly.setAttribute('fill', color);
					poly.setAttribute('opacity', '0.68');
					return poly;
				}
			}

			function redrawTerrain() {
				var svg = document.getElementById('terrain_svg');
				svg.innerHTML = '';
				terrainElements = {};
				for (var key in terrainGrid) {
					var parts = key.split(',');
					var el = createTerrainElement(parseInt(parts[0], 10), parseInt(parts[1], 10), terrainGrid[key]);
					if (el) {
						svg.appendChild(el);
						terrainElements[key] = el;
					}
				}
			}

			function clearAllTerrain() {
				if (!confirm('确定清除所有已绘制地形？')) return;
				terrainGrid = {};
				terrainElements = {};
				document.getElementById('terrain_svg').innerHTML = '';
			}

			(function initTerrainDrawing() {
				var layer = document.getElementById('terrain_layer');
				var svg = document.getElementById('terrain_svg');
				var isPainting = false;
				var lastCellKey = null;

				function paintAt(e) {
					var cell = getCellFromEvent(e);
					var key = cell.x + ',' + cell.y;
					if (key === lastCellKey) return;
					lastCellKey = key;

					if (currentTerrain === 'erase') {
						delete terrainGrid[key];
						if (terrainElements[key]) {
							terrainElements[key].remove();
							delete terrainElements[key];
						}
					} else {
						terrainGrid[key] = currentTerrain;
						if (terrainElements[key]) terrainElements[key].remove();
						var el = createTerrainElement(cell.x, cell.y, currentTerrain);
						if (el) {
							svg.appendChild(el);
							terrainElements[key] = el;
						}
					}
				}

				layer.addEventListener('pointerdown', function(e) {
					if (!drawMode || e.button !== 0) return;
					isPainting = true;
					lastCellKey = null;
					paintAt(e);
					layer.setPointerCapture(e.pointerId);
				});
				layer.addEventListener('pointermove', function(e) {
					if (!drawMode || !isPainting) return;
					paintAt(e);
				});

				function endPaint(e) {
					if (!isPainting) return;
					isPainting = false;
					lastCellKey = null;
					if (layer.hasPointerCapture && layer.hasPointerCapture(e.pointerId)) layer.releasePointerCapture(e
						.pointerId);
				}
				layer.addEventListener('pointerup', endPaint);
				layer.addEventListener('pointercancel', endPaint);
			})();
		</script>
	</body>
