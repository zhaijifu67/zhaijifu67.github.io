<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>页面走丢了 - 宅爷的工具箱</title>
		<meta name="robots" content="noindex">
		<link rel="icon" href="https://zhaijifu67.github.io/favicon.ico">

		<!-- 绝对路径：从任意层级触发 404 都能正确加载 -->
		<link rel="stylesheet" href="/assets/css/base.css">
		<script src="/assets/js/theme.js"></script>

		<style>
			.error-page {
				max-width: 560px;
				margin: 72px auto 48px;
				padding: 44px 28px 36px;
				text-align: center;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: var(--shadow-1);
				position: relative;
				overflow: hidden;
			}

			/* 右上角一抹品牌色光晕，和页头 hero 呼应 */
			.error-page::after {
				content: "";
				position: absolute;
				top: -80px;
				right: -80px;
				width: 200px;
				height: 200px;
				border-radius: 50%;
				background: radial-gradient(circle, var(--brand-soft), transparent 70%);
				pointer-events: none;
			}

			.error-code {
				font-size: clamp(64px, 16vw, 112px);
				font-weight: 800;
				line-height: 1;
				letter-spacing: -0.04em;
				background: linear-gradient(135deg, var(--brand), #8b5cf6);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			.error-page h1 {
				margin-top: 14px;
				font-size: clamp(1.15rem, 1rem + 0.6vw, 1.4rem);
				font-weight: 700;
			}

			.error-page p {
				margin-top: 8px;
				color: var(--muted);
				font-size: 14px;
			}

			.error-actions {
				display: flex;
				justify-content: center;
				flex-wrap: wrap;
				gap: 10px;
				margin-top: 24px;
			}

			.btn-home,
			.btn-ghost {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				height: 42px;
				padding: 0 22px;
				border-radius: 10px;
				font-size: 14px;
				font-weight: 600;
				transition: filter .18s, transform .18s, background-color .18s, border-color .18s;
			}

			.btn-home {
				background: var(--brand);
				color: #fff;
			}

			[data-theme="dark"] .btn-home {
				color: #0b0d11;
				/* 暗色下品牌色偏亮，文字转深保证对比度 */
			}

			.btn-home:hover {
				filter: brightness(1.08);
				transform: translateY(-1px);
			}

			.btn-ghost {
				border: 1px solid var(--border);
				color: var(--muted);
				background: transparent;
			}

			.btn-ghost:hover {
				color: var(--text);
				border-color: var(--border-strong);
				background: var(--surface-2);
			}

			/* 常用工具快捷入口 */
			.error-links {
				margin-top: 28px;
				padding-top: 20px;
				border-top: 1px solid var(--border);
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
			}

			.error-links a {
				padding: 5px 13px;
				border: 1px solid var(--border);
				border-radius: 999px;
				color: var(--muted);
				font-size: 13px;
				transition: color .18s, border-color .18s, background-color .18s;
			}

			.error-links a:hover {
				color: var(--text);
				border-color: var(--border-strong);
				background: var(--surface-2);
			}

			@media (max-width: 480px) {
				.error-page {
					margin-top: 40px;
					padding: 36px 20px 28px;
				}

				.btn-home,
				.btn-ghost {
					flex: 1 1 100%;
				}
			}

			@media (prefers-reduced-motion: reduce) {

				.btn-home:hover,
				.btn-ghost:hover {
					transform: none;
				}
			}
		</style>
	</head>
	<body>

		<!-- 顶栏自动注入：script.src 为绝对路径，logo 会正确指向站点根 -->
		<script src="/assets/js/header.js"></script>

		<main class="wrap">
			<section class="error-page">
				<div class="error-code" aria-hidden="true">404</div>
				<h1>页面走丢了</h1>
				<p>你访问的页面不存在，可能已被移动或删除。</p>

				<div class="error-actions">
					<a class="btn-home" href="/">返回首页</a>
					<button class="btn-ghost" type="button"
						onclick="history.length > 1 ? history.back() : location.href='/'">
						返回上一页
					</button>
				</div>
			</section>
		</main>

	</body>
</html>
