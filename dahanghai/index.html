				<h2 id="activity">今日活动</h2>
				<div id="activityContent" class="center"></div>
				<h2 id="incubateData">孵化计算</h2>
				<div id="eggContent" class="center">
					<div>孵化目标</div>
					<input type="text" list="petList" onchange="changeIncubate()" id="incubate">
					<button onclick="countIncubate()">自动计算</button>
					<div class="tips2">
						<strong>自动计算设置</strong><br>
						<span>计算次数（过大会卡住）</span><input type="number" value="99" id="countTimesMax"><br>
						<span>默认只计算食物和蛋素材，修改请到<a onclick="aScroll('eggData')">蛋孵化色素数据</a>修改</span>
					</div>
					<br>
					<table id="incubateTable"></table>
					<div>蛋基础属性</div>
					<input type="number" class="eggBase" id="eggGreen" value="0" onchange="changeEggSelect()">
					<input type="number" class="eggBase" id="eggRed" value="0" onchange="changeEggSelect()">
					<input type="number" class="eggBase" id="eggBlue" value="0" onchange="changeEggSelect()">
					<input type="number" class="eggBase" id="eggPurple" value="0" onchange="changeEggSelect()">
					<input type="number" class="eggBase" id="eggYellow" value="0" onchange="changeEggSelect()">
					<input type="number" class="eggBase" id="eggBlack" value="0" onchange="changeEggSelect()">
					<div>材料选择</div>
					<span>蛋的星级</span>
					<select id="eggStar" onchange="changeSelect(event);changeEggStar();">
						<option value="1">★☆☆☆☆，5种材料，属性上限100</option>
						<option value="2">★★☆☆☆，6种材料，属性上限200</option>
						<option value="3">★★★☆☆，7种材料，属性上限300</option>
						<option value="4">★★★★☆，8种材料，属性上限400</option>
						<option value="5">★★★★★，9种材料，属性上限500</option>
						<option value="6">双六特殊蛋，12种材料，属性上限500</option>
					</select><br>
					<input type="text" list="eggList" class="selectEgg" id="selectEgg1" onchange="changeEggSelect()">
					<input type="text" list="eggList" class="selectEgg" id="selectEgg2" onchange="changeEggSelect()">

					<input type="text" list="eggList" class="selectEgg" id="selectEgg7" disabled
						onchange="changeEggSelect()">
					<input type="text" list="eggList" class="selectEgg" id="selectEgg8" disabled
